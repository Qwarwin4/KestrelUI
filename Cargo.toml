[profile.dev]
# file:line is all the logged backtraces use; full debug info made linking slow and the
# PDBs hundreds of megabytes
debug = "line-tables-only"
strip = false
opt-level = 0
incremental = true

# our crates stay quick to rebuild, dependencies (image decoding, serde, webview glue) get
# light optimizations so a debug build doesn't feel sluggish to use
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.rust-analyzer]
inherits = "dev"
debug = false

[profile.release]
debug = "limited"
strip = true
# speed over size: icon extraction, thumbnails and window bookkeeping run on every event
opt-level = 3
lto = true
codegen-units = 1

[workspace]
members = [
  "libs/core",
  "libs/positioning",
  "libs/slu-ipc",
  "libs/slu-macros",
  "libs/utils",
  "src",
  "src/hook_dll",
]
resolver = "3"
lints = {}

[workspace.dependencies]
tokio = "1.49.0"
thiserror = "2.0.18"
serde = "1.0"
serde_json = "1.0"
serde_path_to_error = "0.1"
