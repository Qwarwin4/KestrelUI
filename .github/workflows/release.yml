name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return JSON.parse(require("fs").readFileSync("package.json", "utf8")).version;
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.version.outputs.result }}";
            const log = require("fs").readFileSync("changelog.md", "utf-8");
            const re = new RegExp(`(?<=\\[${version}\\]\\s)([\\s\\S]*?)(?=\\s## \\[)`);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `WinUIRev v${version}`,
              body: log.match(re)?.[0].trim() || "",
              generate_release_notes: true,
              draft: true,
            });
            return data.id;

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-2025
    env:
      WINUIREV_PUBKEY: ${{ secrets.WINUIREV_PUBKEY }}
      WINUIREV_DISCORD_ID: ${{ vars.WINUIREV_DISCORD_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.target }}
          cache-key-prefix: rust-release-${{ matrix.target }}

      - run: npm install
      - run: cargo build --release --target ${{ matrix.target }} -p sluhk
      - run: npx tauri build --ci --target ${{ matrix.target }}

      - name: Sign installer for the updater
        shell: pwsh
        run: |
          $v = "${{ needs.release.outputs.version }}"
          $exe = "target/${{ matrix.target }}/release/bundle/nsis/WinUIRev_${v}_${{ matrix.arch }}-setup.exe"
          Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter *.sig | Remove-Item
          npx tauri signer sign "$exe"

      - uses: svenstaro/upload-release-action@v2
        with:
          release_id: ${{ needs.release.outputs.id }}
          file: target/${{ matrix.target }}/release/bundle/nsis/*
          file_glob: true

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.release.outputs.id }},
              draft: false,
            });
      - uses: ./.github/actions/generate-update-manifest
        with:
          release-id: ${{ needs.release.outputs.id }}
          version: ${{ needs.release.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
