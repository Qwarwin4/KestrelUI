cancel: Hủy
done: Hoàn tất
elevated:
  description: >-
    WinUIRev hiện đang chạy dưới quyền Quản trị viên (Administrator).

    Điều này không giúp tăng thêm tính năng nào mà có thể tiềm ẩn rủi ro bảo
    mật.

    Để đảm bảo an toàn, vui lòng khởi động lại ứng dụng với quyền người dùng
    thông thường.
  title: Đang chạy dưới quyền Quản trị viên
file_explorer: Trình quản lý tệp (File Explorer)
resource:
  added: Đã thêm một tài nguyên mới
  download_failed_body: >-
    Đã xảy ra lỗi trong quá trình tải tài nguyên, vui lòng báo lại cho đội ngũ
    phát triển WinUIRev.
  download_failed_title: Tải tài nguyên thất bại
  downloading: Đang tải gói dữ liệu...
  downloading_body: Quá trình này có thể mất vài giây, vui lòng không đóng cửa sổ.
  enable: Bật
runtime:
  corrupted_data: Dữ liệu bị lỗi
  corrupted_file: Tệp cấu hình bị lỗi, hệ thống sẽ sử dụng các giá trị mặc định thay thế.
  corrupted_file_path: Đường dẫn tệp bị lỗi
  download: Đi tới trang tải xuống
  files_integrity: >-
    Không thể xác minh tính toàn vẹn của các tệp ứng dụng.

    Điều này có thể xảy ra khi tệp bị chỉnh sửa, hư hỏng hoặc quá trình cài đặt
    bị gián đoạn.

    Vì lý do an toàn, WinUIRev không thể tiếp tục hoạt động.

    Vui lòng cài đặt lại ứng dụng từ trang chủ chính thức.
  files_integrity_title: Cảnh báo bảo mật - Kiểm tra toàn vẹn tệp thất bại
  not_found: Không tìm thấy WebView2 Runtime
  not_found_description: >-
    WinUIRev yêu cầu Microsoft WebView2 Runtime để hoạt động. Vui lòng cài đặt
    bổ sung.
  outdated: WebView2 Runtime đã lỗi thời
  outdated_description: >-
    WinUIRev yêu cầu WebView2 Runtime phiên bản %{min_version} trở lên. Vui
    lòng cập nhật phiên bản mới hơn.
service:
  not_running: Dịch vụ WinUIRev Service chưa chạy
  not_running_description: >-
    Dịch vụ nền WinUIRev (winuirev-service) là thành phần phụ trợ bắt buộc để ứng
    dụng hoạt động ổn định và an toàn.
  not_running_ok: Khởi động dịch vụ
