cancel: Отмена
done: Сделанный
elevated:
  description: >-
    KestrelUI работает с правами администратора. Это не добавляет и не улучшает
    какие-либо функции и может представлять угрозу безопасности. Для большей
    безопасности перезапустите его без прав администратора.
  title: Запуск от имени администратора
file_explorer: Проводник файлов
resource:
  added: Добавлен новый ресурс
  download_failed_body: >-
    Что-то пошло не так при загрузке ресурса, пожалуйста, сообщите об этом
    команде разработчиков KestrelUI.
  download_failed_title: Загрузка ресурса не удалась
  downloading: Загрузка активов...
  downloading_body: Это может занять несколько секунд, пожалуйста, не закрывайте окно.
  enable: Включить
runtime:
  corrupted_data: Поврежденные данные
  corrupted_file: Файл конфигурации поврежден, вместо него используются значения по умолчанию.
  corrupted_file_path: Поврежденный путь к файлу
  download: Перейти на страницу загрузки
  files_integrity: >-
    Нам не удалось проверить целостность файлов приложения.

    Это может произойти, если файлы были изменены, повреждены или установка не
    завершена.

    По соображениям безопасности работа KestrelUI не может продолжаться.

    Пожалуйста, переустановите его с официального сайта.
  files_integrity_title: "Оповещение системы безопасности: не удалось проверить целостность файлов"
  not_found: Среда выполнения WebView2 не найдена
  not_found_description: >-
    Для KestrelUI требуется среда выполнения Webview2. Пожалуйста, установите
    ее.
  outdated: Среда выполнения WebView2 устарела
  outdated_description: >-
    Для KestrelUI требуется среда выполнения Webview2 %{min_version} или выше.
    Пожалуйста, обновите ее.
seelen_import:
  title: Импорт из Seelen UI
  body: >-
    Найдены настройки Seelen UI в %{path}. Перенести настройки, темы,
    виджеты, иконки и обои в KestrelUI?
service:
  not_running: Служба KestrelUI не запущена
  not_running_description: >-
    Служба KestrelUI (kestrelui-service) — это зависимость/помощник для правильной
    работы приложения.
  not_running_ok: Запустить службу
shortcut:
  conflicts:
    body: >-
      Некоторые сочетания клавиш назначены нескольким действиям. Переназначьте
      их.
    dismiss: Закрыть
    review: Проверить
    title: Обнаружены конфликты сочетаний клавиш
  register:
    placeholder: Нажмите любое сочетание клавиш
    title: Регистрация нового сочетания клавиш
widget_liveness:
  failed_description: |-
    Виджет «%{widget_name}» слишком много раз переставал отвечать.

    Вы можете попробовать перезапустить приложение.
  failed_title: Ошибка виджета
widget_permissions:
  perm_kill_processes: принудительно закрывать приложения
  perm_manage_app_windows: >-
    управлять окнами других приложений (фокусировать, закрывать, сворачивать,
    перемещать)
  perm_modify_configuration: изменить конфигурацию пользовательского интерфейса KestrelUI
  perm_open_file: открывать файлы
  perm_run: запускать программы
  request_description: |-
    Виджет «%{widget_name}» запрашивает разрешение на %{command}.

    Вы хотите это разрешить?
  request_title: Запрос разрешения виджета
