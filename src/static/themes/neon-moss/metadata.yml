id: "@kestrel/neon-moss"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
  tags:
    - dark
    - glass
    - neon
settings:
  - syntax: <color>
    name: --neon-color
    label:
      en: Neon color
      ru: Цвет неона
    initialValue: "#5ef0a0"
  - syntax: <boolean>
    name: --neon-icon-follow
    label:
      en: Icon uses the neon color
      ru: Иконка цвета неона
    initialValue: true
  - syntax: <color>
    name: --neon-icon-color
    label:
      en: Icon color
      ru: Цвет иконки
    initialValue: "#5ef0a0"
  - syntax: <number>
    name: --neon-glass
    label:
      en: Glass opacity
      ru: Прозрачность стекла
    initialValue: 0.62
    min: 0.3
    max: 1
    step: 0.02
  - syntax: <boolean>
    name: --neon-glow
    label:
      en: Glow
      ru: Свечение
    initialValue: true
  - syntax: <boolean>
    name: --neon-shell
    label:
      en: Neon on the dock and toolbar
      ru: Неон на доке и панели
    initialValue: false
  - syntax: <boolean>
    name: --neon-bar-custom
    label:
      en: Own toolbar color
      ru: Свой цвет панели
    initialValue: false
  - syntax: <color>
    name: --neon-bar-color
    label:
      en: Toolbar color
      ru: Цвет панели
    initialValue: "#0b1410"
  - syntax: <boolean>
    name: --neon-dock-custom
    label:
      en: Own dock color
      ru: Свой цвет дока
    initialValue: false
  - syntax: <color>
    name: --neon-dock-color
    label:
      en: Dock color
      ru: Цвет дока
    initialValue: "#0b1410"
styles:
  "@seelen/fancy-toolbar": !include styles/toolbar.scss
  "@seelen/weg": !include styles/weg.scss
sharedStyles: !include ./shared.scss
