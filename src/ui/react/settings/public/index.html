<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./index.css" />
    <script src="/vanilla/entry-point/index.js" type="module"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
    // the backend injects the neon color before load, localStorage is the fallback
    // (the Windows accent when Neon Moss is off)
    let color = window.__KESTREL_SPLASH;
    try {
      color = color || localStorage.getItem("kestrel.splash-color");
    } catch {
      // no storage, default splash
    }
    if (color && CSS.supports("color", color)) {
      document.documentElement.style.setProperty("--splash", color);
    }
    </script>
    <div id="splashscreen">
      <span class="splashscreen-logo" aria-hidden="true"><span></span></span>
      <span class="splashscreen-name">KestrelUI</span>
    </div>
    <style>
    #splashscreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;

      background:
        radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--splash, #5ef0a0) 14%, transparent), transparent 55%),
        oklch(from var(--splash, #5ef0a0) 14% calc(c * 0.06) h);
      transition: opacity 300ms linear;
      opacity: 1;

      &.hidden {
        display: none;
      }

      &.vanish {
        opacity: 0;
      }

      .splashscreen-logo {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 26px;
        background-color: oklch(from var(--splash, #5ef0a0) 20.5% calc(c * 0.1) h);
        border: 1px solid color-mix(in srgb, var(--splash, #5ef0a0) 35%, transparent);
        box-shadow: 0 0 48px -12px color-mix(in srgb, var(--splash, #5ef0a0) 45%, transparent);

        > span {
          position: absolute;
          inset: 16px;
          background-color: var(--splash, #5ef0a0);
          mask: url("./logo-mark.svg") center / contain no-repeat;
        }
      }

      .splashscreen-name {
        font: 600 56px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: oklch(from var(--splash, #5ef0a0) 96% calc(c * 0.1) h);
      }
    }
    </style>
  </body>
</html>
