<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="./index.css" />
    <script src="/vanilla/entry-point/index.js" type="module"></script>
  </head>
  <body>
    <div id="root"></div>

    <div id="splashscreen">
      <img class="splashscreen-logo" src="./logo.svg" alt="" />
      <span class="splashscreen-name">KestrelUI</span>
    </div>
    <style>
    #splashscreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;

      background:
        radial-gradient(circle at 50% 45%, rgb(94 240 160 / 0.14), transparent 55%),
        #070b09;
      transition: opacity 300ms linear;
      opacity: 1;

      &.hidden {
        display: none;
      }

      &.vanish {
        opacity: 0;
      }

      .splashscreen-logo {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 24px rgb(94 240 160 / 0.35));
      }

      .splashscreen-name {
        font: 600 56px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: #e8fff2;
      }
    }
    </style>
  </body>
</html>
